name: Build CV (HTML & PDF)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggers

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Read version and update config
      run: |
        VERSION=$(cat version | tr -d '\n' | tr -d '\r')
        echo "Read version: '$VERSION'"
        # Update the version directly in _config.yml
        sed -i "s/version: dev/version: $VERSION/" _config.yml
        echo "Updated _config.yml with version: $VERSION"
        grep "version:" _config.yml
      shell: bash

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true

    - name: Install Jekyll dependencies
      run: |
        bundle install
      
    - name: Setup Typst
      uses: typst-community/setup-typst@v3
      with:
        typst-version: 'latest'

    - name: Generate PDF with Typst
      run: |
        typst compile cv-printable.typ George_Mamaladze_CV.pdf
        ls -la
        echo "PDF generated successfully"

    - name: Build Jekyll site with version
      run: |
        echo "=== Contents of _config.yml before build ==="
        cat _config.yml
        echo "=== Building site ==="
        bundle exec jekyll build --trace
        echo "=== Checking generated index.html ==="
        grep "cv-version" _site/index.html || echo "cv-version not found"
      shell: bash
          
    - name: Verify PDF in site directory
      run: |
        ls -la _site/
        if [ -f "_site/George_Mamaladze_CV.pdf" ]; then
          echo "✓ PDF found in _site directory"
        else
          echo "✗ PDF NOT found in _site directory - copying manually"
          cp "George_Mamaladze_CV.pdf" _site/
        fi
        
    - name: Verify version in generated HTML
      run: |
        echo "Checking if version appears in index.html..."
        if grep -q "Version: $(cat version)" _site/index.html; then
          echo "✓ Version $(cat version) found in index.html"
        else
          echo "✗ Version NOT found in index.html"
          echo "Contents around 'Version:' in index.html:"
          grep -A 2 -B 2 "Version:" _site/index.html || echo "Version string not found at all"
        fi
    
        
    - name: Setup Pages (if main branch)
      if: github.ref == 'refs/heads/main'
      uses: actions/configure-pages@v4
      
    - name: Upload to GitHub Pages
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@v3
      with:
        path: _site
        
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    
    permissions:
      pages: write
      id-token: write
      
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
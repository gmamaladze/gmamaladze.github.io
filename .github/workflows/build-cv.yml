name: Build CV (HTML & PDF)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggers

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true

    - name: Install Jekyll dependencies
      run: |
        bundle install
      
    - name: Setup Typst
      uses: typst-community/setup-typst@v3
      with:
        typst-version: 'latest'

    - name: Generate PDF with Typst
      run: |
        typst compile cv-printable.typ George_Mamaladze_CV.pdf
        ls -la
        echo "PDF generated successfully"

    - name: Copy PDF to site directory before Jekyll build
      run: |
        mkdir -p _site
        cp George_Mamaladze_CV.pdf _site/
        echo "✓ PDF copied to _site directory before Jekyll build"
    
    - name: Build Jekyll site
      run: |
        bundle exec jekyll build --trace
      shell: bash
          
    - name: Verify PDF in site directory
      run: |
        ls -la _site/
        if [ -f "_site/George_Mamaladze_CV.pdf" ]; then
          echo "✓ PDF found in _site directory"
          ls -lh _site/George_Mamaladze_CV.pdf
        else
          echo "✗ PDF NOT found in _site directory"
          exit 1
        fi
        
    - name: Setup Pages (if main branch)
      if: github.ref == 'refs/heads/main'
      uses: actions/configure-pages@v4
      
    - name: Upload to GitHub Pages
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@v3
      with:
        path: _site
        
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    
    permissions:
      pages: write
      id-token: write
      
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4